services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20M"
  api-1:
    image: diemorei/rinhabackend2026:v1  
    build: .
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "175M"

  api-2:
    image: diemorei/rinhabackend2026:v1
    build: .
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "175M"